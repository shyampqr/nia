<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Nextgenz International Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('/images/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }
        .login-card {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light opacity-75 mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Nextgenz International Academy</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Home</a>
            </div>
        </div>
    </nav>

    <div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
        <div class="card login-card p-4" style="max-width: 400px; width: 100%;">
            <div class="text-center mb-4">
                <!-- Optional: Add logo here if available -->
                <!-- <img src="/images/logo.jpeg" alt="Logo" width="80" class="mb-3 rounded-circle"> -->
                <h3 class="fw-bold">Login</h3>
            </div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="phone" class="form-label fw-semibold">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter your mobile number" required pattern="[0-9]{10}">
                    <div class="form-text">We'll send you an OTP for verification.</div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" style="background-color: #C28813; border-color: #C28813;">Send OTP</button>
            </form>
        </div>
    </div>
</body>
</html>
