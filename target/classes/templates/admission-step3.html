<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admission Form - Step 3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(to right, #f9e79f, #f1c40f, #d4ac0d);
            font-family: 'Segoe UI', sans-serif;
        }
        .form-card {
            background: #fffbea;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            padding: 30px;
            margin-top: 40px;
            border: 2px solid #d4ac0d;
        }
        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .form-header h2 {
            font-weight: bold;
            color: #b7950b;
        }
        .section-title {
            font-weight: 600;
            color: #7d6608;
            margin-top: 20px;
            margin-bottom: 15px;
        }
        .btn-primary {
            background: linear-gradient(to right, #f1c40f, #d4ac0d);
            border: none;
            color: #fff;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: linear-gradient(to right, #d4ac0d, #f1c40f);
        }
        .form-label {
            font-weight: 500;
            color: #7d6608;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="form-card">
        <div class="form-header">
            <h2>Nextgenz International Academy</h2>
            <p class="text-muted">Admission Application Form - Step 3 of 6</p>
        </div>

        <!-- Student Details Section -->
        <h5 class="section-title">📋 Student Details</h5>
        <div class="row mb-3">
            <!-- First Name -->
            <div class="col-md-4">
                <label class="form-label">First Name *</label>
                <input type="text" name="firstName" class="form-control" required>
            </div>
            <!-- Middle Name -->
            <div class="col-md-4">
                <label class="form-label">Middle Name</label>
                <input type="text" name="middleName" class="form-control">
            </div>
            <!-- Last Name -->
            <div class="col-md-4">
                <label class="form-label">Last Name (Surname) *</label>
                <input type="text" name="lastName" class="form-control" required>
            </div>
        </div>

        <div class="row mb-3">
            <!-- Caste Dropdown -->
            <div class="col-md-3">
                <label class="form-label">Caste *</label>
                <select name="caste" class="form-select" required>
                    <option value="">Select</option>
                    <option>SC</option>
                    <option>ST</option>
                    <option>BC</option>
                    <option>EWS</option>
                    <option>OC</option>
                    <option>Others</option>
                </select>
            </div>

            <!-- Religion Dropdown -->
            <div class="col-md-3">
                <label class="form-label">Religion *</label>
                <select name="religion" class="form-select" required>
                    <option value="">Select</option>
                    <option>Hindu</option>
                    <option>Muslim</option>
                    <option>Christian</option>
                    <option>Sikh</option>
                    <option>Other</option>
                </select>
            </div>

            <!-- Nationality Dropdown -->
            <div class="col-md-3">
                <label class="form-label">Nationality *</label>
                <select name="nationality" class="form-select" required>
                    <option value="">Select</option>
                    <option>Indian</option>
                    <option>American</option>
                    <option>British</option>
                    <option>Australian</option>
                    <option>Canadian</option>
                    <option>Other</option>
                </select>
            </div>

            <!-- Mother Tongue Dropdown -->
            <div class="col-md-3">
                <label class="form-label">Mother Tongue *</label>
                <select name="motherTongue" class="form-select" required>
                    <option value="">Select</option>
                    <option>Hindi</option>
                    <option>English</option>
                    <option>Bengali</option>
                    <option>Telugu</option>
                    <option>Tamil</option>
                    <option>Marathi</option>
                    <option>Gujarati</option>
                    <option>Kannada</option>
                    <option>Punjabi</option>
                    <option>Other</option>
                </select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-3">
                <label class="form-label">Blood Group</label>
                <select name="bloodGroup" class="form-select">
                    <option value="">Select</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>O+</option>
                    <option>O-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Student Aadhaar No</label>
                <input type="text" name="aadhaarNo" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">Previous School *</label>
                <input type="text" name="previousSchool" class="form-control" required>
            </div>
            <div class="col-md-9">
                <label class="form-label">Previous School Address</label>
                <textarea name="previousSchoolAddress" class="form-control"></textarea>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <label class="form-label">Identification Mark 1</label>
                <input type="text" name="idMark1" class="form-control">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <label class="form-label">Identification Mark 2</label>
                <input type="text" name="idMark2" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">Gender</label>
                <select name="gender" class="form-select">
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Date of Birth</label>
                <input type="date" name="dob" class="form-control" th:value="${dob}">
            </div>
        </div>

        <!-- Age Display -->
        <div class="mb-3">
            <label class="form-label">Age as on date:</label>
            <span class="fw-bold text-danger fs-5">15 Years 2 Months and 16 Days</span>
        </div>

        <!-- Save & Next Button -->
        <div class="text-center mt-4">
            <button type="button" class="btn btn-secondary">Previous</button>
            <button type="submit" class="btn btn-primary">Save & Next</button>
        </div>
    </div>
</div>
</body>
</html>
