<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP - Nextgenz International Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('/images/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }
        .otp-card {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light opacity-75 mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Nextgenz International Academy</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Home</a>
            </div>
        </div>
    </nav>

    <div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
        <div class="card otp-card p-4" style="max-width: 400px; width: 100%;">
            <h3 class="text-center fw-bold mb-3">Verify OTP</h3>
            <p class="text-muted text-center">OTP sent to <span th:text="${session.phoneNumber}" class="fw-semibold"></span></p>

            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/otp-verify}" method="post">
                <div class="mb-3">
                    <label for="otp" class="form-label fw-semibold">Enter OTP</label>
                    <input type="text" class="form-control" id="otp" name="otp" placeholder="Enter OTP received" required pattern="[0-9]{6}">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" style="background-color: #C28813; border-color: #C28813;">Verify</button>
            </form>
            <div class="mt-3 text-center">
                <a href="/login" class="text-decoration-none">Resend OTP</a>
            </div>
        </div>
    </div>
</body>
</html>
