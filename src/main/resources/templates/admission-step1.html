<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admission Form - Nextgenz Academy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(to right, #f9e79f, #f1c40f, #d4ac0d);
            font-family: 'Segoe UI', sans-serif;
        }
        .form-card {
            background: #fffbea;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            padding: 30px;
            margin-top: 40px;
            border: 2px solid #d4ac0d;
        }
        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .form-header h2 {
            font-weight: bold;
            color: #b7950b;
        }
        .section-title {
            font-weight: 600;
            color: #7d6608;
            margin-top: 20px;
            margin-bottom: 15px;
        }
        .btn-primary {
            background: linear-gradient(to right, #f1c40f, #d4ac0d);
            border: none;
            color: #fff;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: linear-gradient(to right, #d4ac0d, #f1c40f);
        }
        .form-label {
            font-weight: 500;
            color: #7d6608;
        }
        .note-box {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
            color: #856404;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="form-card">
        <div class="form-header">
            <h2>Nextgenz International Academy</h2>
            <p class="text-muted">Admission Application Form</p>
        </div>
        <form th:action="@{/admission}" method="post" novalidate>

            <!-- Four Fields in One Row -->
            <h5 class="section-title">📅 Admission Details</h5>
            <div class="row mb-3">
                <!-- Academic Year -->
                <div class="col-md-3">
                    <label class="form-label">Academic Year *</label>
                    <select name="academicYear" class="form-select" required>
                        <option value="">Select Year</option>
                        <option>2025-2026</option>
                        <option>2026-2027</option>
                        <option>2027-2028</option>
                    </select>
                </div>
                <!-- Country Code -->
                <div class="col-md-2">
                    <label class="form-label">Country Code *</label>
                    <select name="countryCode" class="form-select" required>
                        <option value="">Code</option>
                        <option value="+91">+91</option>
                        <option value="+1">+1</option>
                        <option value="+44">+44</option>
                        <option value="+61">+61</option>
                        <option value="+971">+971</option>
                    </select>
                </div>
                <!-- Primary Phone -->
                <div class="col-md-4">
                    <label class="form-label">Primary Phone *</label>
                    <input type="tel" name="primaryPhone" class="form-control" required pattern="[0-9]{7,12}" title="Enter a valid phone number">
                </div>
                <!-- Student DOB -->
                <div class="col-md-3">
                    <label class="form-label">Student DOB *</label>
                    <input type="date" name="dob" class="form-control" required>
                </div>
            </div>

            <!-- Grade Seeking Admission -->
            <div class="mb-3">
                <label class="form-label">Grade Seeking Admission *</label>
                <select name="gradeSeeking" class="form-select" required>
                    <option value="">Select Grade</option>
                    <option>Nursery</option>
                    <option>Kindergarten</option>
                    <option>Grade 1</option>
                    <option>Grade 2</option>
                    <option>Grade 3</option>
                    <option>Grade 4</option>
                    <option>Grade 5</option>
                    <option>Grade 6</option>
                    <option>Grade 7</option>
                    <option>Grade 8</option>
                    <option>Grade 9</option>
                    <option>Grade 10</option>
                    <option>Grade 11</option>
                    <option>Grade 12</option>
                </select>
            </div>

            <!-- Note Section -->
            <div class="note-box">
                <strong>NOTE:</strong> If you have filled the Enquiry Form, please replicate the same details above.
            </div>

            <!-- Next Button -->
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary w-50">Next</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
