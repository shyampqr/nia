<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Exam Result - Nextgenz International Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Roboto', sans-serif;
        }
        .result-container {
            max-width: 600px;
            margin: 80px auto;
            background-color: #fff;
            border-top: 10px solid #673ab7;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .result-title {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 20px;
        }
        .score-display {
            font-size: 48px;
            font-weight: 500;
            color: #3f51b5;
        }
        .score-total {
            font-size: 24px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="result-container">
        <h1 class="result-title">Your Exam Result</h1>
        <p>Thank you for completing the exam.</p>
        <hr class="my-4">
        <p class="lead">You scored:</p>
        <div>
            <span class="score-display" th:text="${score}">0</span>
            <span class="score-total" th:text="'/ ' + ${total}">/ 10</span>
        </div>
        <div class="mt-4">
            <a href="/exam" class="btn btn-primary" style="background-color: #673ab7; border-color: #673ab7;">Take Another Exam</a>
            <a href="/" class="btn btn-secondary">Back to Home</a>
        </div>
    </div>
</body>
</html>
