<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nextgenz AI Assistant - Nextgenz International Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold-deep:    #7B5A00;
            --gold-mid:     #C8960C;
            --gold-bright:  #F5C518;
            --gold-pale:    #FDE99A;
            --gold-cream:   #FFF8E1;
            --gold-shine:   #FFE55C;
            --shadow-warm:  rgba(123, 90, 0, 0.25);
            --text-dark:    #2C1A00;
            --text-mid:     #5A3E00;
            --accent-dark:  #3D2A00;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'DM Sans', sans-serif;
            background:
                    radial-gradient(ellipse at 10% 20%, rgba(245,197,24,0.35) 0%, transparent 55%),
                    radial-gradient(ellipse at 85% 70%, rgba(200,150,12,0.40) 0%, transparent 55%),
                    radial-gradient(ellipse at 50% 50%, rgba(253,233,154,0.20) 0%, transparent 70%),
                    linear-gradient(145deg, #C8960C 0%, #F5C518 30%, #FDE99A 55%, #C8960C 80%, #7B5A00 100%);
            background-attachment: fixed;
        }

        /* Subtle noise texture overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            background-size: 200px 200px;
            pointer-events: none;
            z-index: 0;
        }

        .page-wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        /* ── Header ── */
        .page-header {
            text-align: center;
            margin-bottom: 1.75rem;
            animation: fadeDown 0.6s ease both;
        }

        .page-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 700;
            color: var(--accent-dark);
            letter-spacing: 0.02em;
            text-shadow: 0 2px 6px rgba(255,255,255,0.5), 0 1px 0 rgba(255,255,255,0.7);
            margin: 0;
        }

        .page-header .subtitle {
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent-dark);
            margin-top: 0.3rem;
            background: rgba(255, 255, 255, 0.55);
            display: inline-block;
            padding: 0.2rem 0.85rem;
            border-radius: 20px;
            border: 1px solid rgba(123, 90, 0, 0.2);
            box-shadow: 0 1px 4px rgba(255,255,255,0.5);
        }

        /* ── Card ── */
        .chat-card {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 248, 225, 0.72);
            backdrop-filter: blur(14px) saturate(1.4);
            -webkit-backdrop-filter: blur(14px) saturate(1.4);
            border: 1px solid rgba(245,197,24,0.55);
            border-radius: 20px;
            box-shadow:
                    0 4px 24px var(--shadow-warm),
                    0 1px 0 rgba(255,255,255,0.6) inset,
                    0 -1px 0 rgba(200,150,12,0.25) inset;
            overflow: hidden;
            animation: fadeUp 0.65s ease both 0.1s;
        }

        /* ── Card top bar ── */
        .card-topbar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.85rem 1.2rem;
            background: linear-gradient(90deg, var(--gold-deep) 0%, var(--gold-mid) 100%);
            border-bottom: 1px solid rgba(255,229,92,0.35);
        }

        .topbar-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
        }
        .topbar-dot:nth-child(1) { background: #ff6b6b; }
        .topbar-dot:nth-child(2) { background: #ffd93d; }
        .topbar-dot:nth-child(3) { background: #6bcb77; }

        .topbar-title {
            flex: 1;
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--gold-cream);
            letter-spacing: 0.06em;
            margin-left: -40px; /* optical center */
        }

        /* ── Chat history ── */
        .chat-container {
            height: 390px;
            overflow-y: auto;
            padding: 1.2rem 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar { width: 5px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(200,150,12,0.4);
            border-radius: 99px;
        }

        /* Messages */
        .user-message { display: flex; justify-content: flex-end; }
        .bot-message  { display: flex; justify-content: flex-start; }

        .user-bubble, .bot-bubble {
            max-width: 72%;
            padding: 0.65rem 1rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.55;
            animation: popIn 0.3s ease both;
        }

        .user-bubble {
            background: linear-gradient(135deg, var(--gold-deep) 0%, var(--gold-mid) 100%);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 10px rgba(123,90,0,0.3);
        }

        .bot-bubble {
            background: rgba(255,255,255,0.78);
            color: var(--text-dark);
            border: 1px solid rgba(200,150,12,0.25);
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(123,90,0,0.12);
        }

        /* Avatar dots */
        .bot-message::before {
            content: '✦';
            flex-shrink: 0;
            align-self: flex-end;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold-mid), var(--gold-bright));
            color: var(--accent-dark);
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 0.5rem;
            box-shadow: 0 2px 6px rgba(200,150,12,0.4);
            line-height: 28px;
            text-align: center;
        }

        /* ── Input area ── */
        .input-area {
            padding: 1rem 1.2rem 1.2rem;
            background: rgba(255,248,225,0.5);
            border-top: 1px solid rgba(200,150,12,0.2);
        }

        .input-group {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(123,90,0,0.15);
        }

        .input-group .form-control {
            background: rgba(255,255,255,0.85);
            border: 1px solid rgba(200,150,12,0.35);
            border-right: none;
            color: var(--text-dark);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            padding: 0.7rem 1rem;
            border-radius: 12px 0 0 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group .form-control::placeholder { color: rgba(90,62,0,0.45); }

        .input-group .form-control:focus {
            background: #fff;
            border-color: var(--gold-mid);
            box-shadow: none;
            outline: none;
        }

        .btn-send {
            background: linear-gradient(135deg, var(--gold-mid) 0%, var(--gold-deep) 100%);
            border: none;
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            font-size: 0.88rem;
            letter-spacing: 0.04em;
            padding: 0.7rem 1.4rem;
            border-radius: 0 12px 12px 0;
            cursor: pointer;
            transition: filter 0.2s, transform 0.15s;
        }

        .btn-send:hover  { filter: brightness(1.12); }
        .btn-send:active { transform: scale(0.97); }

        /* ── Footer actions ── */
        .card-footer-actions {
            padding: 0.5rem 1.2rem 1rem;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
        }

        .btn-logout, .btn-home {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--gold-deep);
            background: transparent;
            border: 1px solid rgba(123,90,0,0.3);
            border-radius: 8px;
            padding: 0.4rem 1.1rem;
            text-decoration: none;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .btn-logout:hover, .btn-home:hover {
            background: var(--gold-deep);
            color: var(--gold-cream);
            border-color: var(--gold-deep);
        }

        .btn-home {
            background: rgba(245,197,24,0.18);
        }

        /* ── Animations ── */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92); }
            to   { opacity: 1; transform: scale(1); }
        }
    </style>
</head>

<body>
<div class="page-wrapper">

    <div class="page-header">
        <h2>Nextgenz AI Assistant</h2>
        <p class="subtitle">Nextgenz International Academy</p>
    </div>

    <div class="chat-card">

        <!-- Window chrome bar -->
        <div class="card-topbar">
            <div class="topbar-dot"></div>
            <div class="topbar-dot"></div>
            <div class="topbar-dot"></div>
            <span class="topbar-title">Chat with Nextgenz AI</span>
        </div>

        <!-- Message history -->
        <div class="chat-container" id="chatHistory">
            <div th:each="msg : ${chatHistory}">
                <div th:if="${#strings.startsWith(msg, 'You:')}" class="user-message">
                    <span class="user-bubble" th:text="${#strings.substring(msg, 5)}">User message</span>
                </div>
                <div th:if="${#strings.startsWith(msg, 'Gemini:')}" class="bot-message">
                    <span class="bot-bubble" th:text="${#strings.substring(msg, 8)}">Bot message</span>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <form th:action="@{/chat/send}" method="post">
                <div class="input-group">
                    <input
                            type="text"
                            class="form-control"
                            name="message"
                            placeholder="Ask me anything…"
                            required
                            autocomplete="off"
                    >
                    <button class="btn-send" type="submit">Send ➤</button>
                </div>
            </form>
        </div>

        <!-- Footer actions -->
        <div class="card-footer-actions">
            <a href="/" class="btn-home">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                Home
            </a>
            <a href="/logout" class="btn-logout">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Logout
            </a>
        </div>

    </div>
</div>

<script>
    // Scroll to bottom on page load
    const chatHistory = document.getElementById("chatHistory");
    chatHistory.scrollTop = chatHistory.scrollHeight;
</script>
</body>
</html>
